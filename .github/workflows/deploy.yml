# Builds the app and publishes it to GitHub Pages.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/urdu-learning-web-app-hq1yxc, codex/improve-audio-recording-studio-features]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # No browser here.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Bake glyphs
        run: npm run bake

      - name: Check committed glyphs are up to date
        # Catches a content/*.json edit committed without re-baking.
        run: git diff --exit-code content/glyphs.json

      - name: Check audio manifest is up to date
        run: |
          npm run audio:manifest
          git diff --exit-code content/audio.json

      - run: npm run build

      - name: Run integrity tests
        # Run after the build so service-worker checks can inspect dist/.
        run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
