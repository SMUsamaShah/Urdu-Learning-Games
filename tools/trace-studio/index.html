<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tracing studio</title>
    <link rel="stylesheet" href="/style.css" />
    <!-- The editor's own styles, from src/ui, served over /lib/ alongside the
         module they belong to. Linked rather than imported because this page
         has no bundler. -->
    <link rel="stylesheet" href="/lib/stroke-editor.css" />
  </head>
  <body>
    <header>
      <h1>Tracing studio</h1>
      <p class="hint">
        Saving writes straight into <code>content/strokes.json</code>. Commit it when you are done.
      </p>
      <div class="import">
        <button type="button" id="btn-import">Import a tablet export…</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden />
      </div>
      <output id="count"></output>
    </header>

    <main id="editor"></main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
