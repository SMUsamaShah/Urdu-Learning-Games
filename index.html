<!doctype html>
<!--
  dir stays ltr even though this is an Urdu app.

  Phaser centres its canvas by setting margin-left, which assumes left-to-right
  block flow. Under dir="rtl" the canvas right-aligns instead and every screen
  sits off-centre. Nothing is lost by keeping the document ltr: no Urdu is laid
  out by the browser at all, because every glyph is a baked path positioned by
  the game (see src/lib/glyph.js), and the right-to-left reading order lives in
  the scenes' own layout maths.
-->
<html lang="ur" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>اردو کھیل — Urdu Learning Games</title>

    <!--
      viewport-fit and user-scalable=no together stop a small child's palm from
      pinch-zooming the game into an unusable state. This is one of the few
      places where disabling zoom is the right call rather than an a11y sin:
      the whole UI is already finger-sized and there is no body text to enlarge.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#8fd4f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Free, open source, ad-free games for learning the Urdu alphabet, numbers and first words."
    />

    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #8fd4f5;
        /* Kills pull-to-refresh and rubber-banding, which otherwise fire
           constantly under a child's dragging. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      /* Shown only if the app fails to start. Never seen during normal play. */
      #boot-error {
        display: none;
        position: fixed;
        inset: 0;
        place-content: center;
        text-align: center;
        padding: 2rem;
        font: 16px/1.6 system-ui, sans-serif;
        color: #4a5068;
      }
      #boot-error code {
        display: block;
        margin-top: 1.25rem;
        padding: 0.75rem 1rem;
        max-width: 46rem;
        margin-inline: auto;
        border-radius: 8px;
        background: #f0e6d2;
        color: #6a5a3f;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: left;
        overflow-wrap: anywhere;
      }
      #boot-error .hint {
        margin-top: 1rem;
        font-size: 13px;
        color: #7b7360;
      }

      /*
        The frame-rate readout. Fixed to the viewport rather than the canvas so
        it stays put while the game letterboxes, and pointer-events: none so it
        can never swallow a tap meant for the game underneath.
      */
      .fps-meter {
        position: fixed;
        top: max(6px, env(safe-area-inset-top));
        right: max(6px, env(safe-area-inset-right));
        z-index: 20;
        padding: 3px 8px;
        border-radius: 8px;
        font:
          600 13px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        background: rgba(43, 48, 71, 0.72);
        color: #fff;
        pointer-events: none;
      }

      .fps-meter[data-level='fair'] {
        color: #ffd166;
      }

      .fps-meter[data-level='poor'] {
        color: #ff8f8f;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-error">
      <p>کھیل لوڈ نہیں ہو سکا</p>
      <p>The game could not load.</p>
      <code id="boot-error-detail"></code>
      <p class="hint">
        Serving this repository's source directly will always fail — the app
        must be built. See the deploy workflow in .github/workflows/.
      </p>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      /*
       * Reports why startup failed rather than just that it did.
       *
       * Three separate things can go wrong and each surfaces differently:
       * a script that never loads fires a capture-phase error on the element,
       * a module that loads but throws fires window.onerror, and a rejected
       * promise inside an async scene fires unhandledrejection.
       */
      (function () {
        var shown = false;
        function fail(detail) {
          if (shown) return;
          shown = true;
          document.getElementById('boot-error').style.display = 'grid';
          document.getElementById('boot-error-detail').textContent = detail;
        }

        window.addEventListener(
          'error',
          function (e) {
            if (e.target && e.target.tagName === 'SCRIPT') {
              fail('Could not load script: ' + (e.target.src || '(inline)'));
            } else if (e.message) {
              fail(e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
            }
          },
          true
        );

        window.addEventListener('unhandledrejection', function (e) {
          fail(String((e.reason && e.reason.message) || e.reason));
        });
      })();
    </script>
  </body>
</html>
