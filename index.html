<!doctype html>
<!-- dir stays ltr even though this is an Urdu app. -->
<html lang="ur" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>اردو کھیل — Urdu Learning Games</title>

    <!-- viewport-fit and user-scalable=no together stop a small child's palm from pinch-zooming the game into an unusable state. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#8fd4f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Free, open source, ad-free games for learning the Urdu alphabet, numbers and first words."
    />

    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #8fd4f5;
        /* Kills pull-to-refresh and rubber-banding, which otherwise fire constantly under a child's dragging. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Everything the app draws, so that it can be turned as one piece. */
      #stage {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
      }

      #stage[data-turn='90'] {
        transform: rotate(90deg) translateY(-100%);
      }

      #stage[data-turn='270'] {
        transform: rotate(-90deg) translateX(-100%);
      }

      /* Flex centres the canvas after Phaser's autoCenter is disabled. */
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      /* Shown only if the app fails to start. */
      #boot-error {
        display: none;
        position: fixed;
        inset: 0;
        place-content: center;
        text-align: center;
        padding: 2rem;
        font: 16px/1.6 system-ui, sans-serif;
        color: #4a5068;
      }
      #boot-error code {
        display: block;
        margin-top: 1.25rem;
        padding: 0.75rem 1rem;
        max-width: 46rem;
        margin-inline: auto;
        border-radius: 8px;
        background: #f0e6d2;
        color: #6a5a3f;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: left;
        overflow-wrap: anywhere;
      }
      #boot-error .hint {
        margin-top: 1rem;
        font-size: 13px;
        color: #7b7360;
      }

      /* The frame-rate readout. */
      .fps-meter {
        position: fixed;
        top: max(6px, env(safe-area-inset-top));
        right: max(6px, env(safe-area-inset-right));
        z-index: 20;
        padding: 3px 8px;
        border-radius: 8px;
        font:
          600 13px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        background: rgba(43, 48, 71, 0.72);
        color: #fff;
        pointer-events: none;
      }

      .fps-meter[data-level='fair'] {
        color: #ffd166;
      }

      .fps-meter[data-level='poor'] {
        color: #ff8f8f;
      }

      /* The service-worker indicator, bottom right, opposite the frame counter. */
      /* Hide the badge when its hidden attribute is set. */
      .update-badge[hidden] {
        display: none;
      }

      .update-badge {
        position: fixed;
        right: 10px;
        bottom: 10px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 6px 8px;
        border-radius: 999px;
        background: rgba(24, 30, 46, 0.62);
        color: #e8eefc;
        font: 500 13px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        pointer-events: none;
        animation: update-in 220ms ease-out;
      }

      @keyframes update-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .update-spinner {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 2px solid rgba(232, 238, 252, 0.28);
        border-top-color: #ffc93c;
        animation: update-spin 800ms linear infinite;
      }

      @keyframes update-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Nothing to fetch, or the job is done: the ring stops and fills in. */
      .update-badge[data-state='current'] .update-spinner,
      .update-badge[data-state='updated'] .update-spinner {
        animation: none;
        border-color: #7ddb9a;
        background: #7ddb9a;
      }

      .update-badge[data-state='updated'] .update-spinner {
        border-color: #ffc93c;
        background: #ffc93c;
      }

      @media (prefers-reduced-motion: reduce) {
        .update-spinner {
          animation-duration: 2400ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="game"></div></div>
    <!-- Outside the stage on purpose. -->
    <div id="boot-error">
      <p>کھیل لوڈ نہیں ہو سکا</p>
      <p>The game could not load.</p>
      <code id="boot-error-detail"></code>
      <p class="hint">
        Serving this repository's source directly will always fail — the app
        must be built. See the deploy workflow in .github/workflows/.
      </p>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      /*
       * Reports why startup failed rather than just that it did.
       *
       * Three separate things can go wrong and each surfaces differently:
       * a script that never loads fires a capture-phase error on the element,
       * a module that loads but throws fires window.onerror, and a rejected
       * promise inside an async scene fires unhandledrejection.
       *
       * This only speaks for STARTUP, and startup is not over when
       * `new Phaser.Game()` returns — that happens synchronously, before a
       * single scene has run. The condition is a scene actually being up, so a
       * throw inside Preload or Home is still reported; anything after that
       * belongs to something running and this must stay out of its way.
       *
       * It did not, and the result was a full-screen "The game could not load"
       * over a game that was visibly running and playable, triggered by a
       * dropped note in the background music. A misleading error report is
       * worse than none: it sends whoever reads it after entirely the wrong
       * thing.
       */
      (function () {
        var shown = false;
        function fail(detail) {
          if (shown || (window.__game && window.__game.scene.getScenes(true).length)) return;
          shown = true;
          document.getElementById('boot-error').style.display = 'grid';
          document.getElementById('boot-error-detail').textContent = detail;
        }

        window.addEventListener(
          'error',
          function (e) {
            if (e.target && e.target.tagName === 'SCRIPT') {
              fail('Could not load script: ' + (e.target.src || '(inline)'));
            } else if (e.message) {
              fail(e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
            }
          },
          true
        );

        window.addEventListener('unhandledrejection', function (e) {
          fail(String((e.reason && e.reason.message) || e.reason));
        });
      })();
    </script>
  </body>
</html>
